# FastAgent configuration for Homework 4.
#
# No API keys live in this file. The LLM provider key is read from the
# environment (ANTHROPIC_API_KEY for the default model below).
#
# Run fast-agent from this directory (homeworks/Homework4) so the relative
# paths below resolve correctly.

# Model used when an agent does not specify one. "haiku" is fast-agent's
# alias for the current Claude Haiku model; override per run with --model.
default_model: haiku

logger:
  level: warning
  show_chat: true
  show_tools: true

mcp:
  servers:
    # Custom Notes server (add_note, list_notes, get_note, delete_note).
    notes:
      transport: stdio
      command: python
      args: ["mcp-server.py", "stdio"]

    # Official mcp-server-git from github.com/modelcontextprotocol/servers.
    # --repository must be a git work-tree root (it does not search parent
    # directories), so it points two levels up at the course repo root.
    # Note: on Windows, uv virtualenvs only ship python.exe (no python3.exe),
    # so "python" is used here; "python3" works on macOS/Linux.
    git:
      transport: stdio
      command: uv
      args: ["run", "python", "-m", "mcp_server_git", "--repository", "../.."]
