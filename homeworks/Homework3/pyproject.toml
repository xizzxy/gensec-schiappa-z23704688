[project]
name = "homework3"
version = "0.1.0"
description = "ReAct agent combining a Python REPL tool with a custom RAG retrieval tool over the Homework2 document corpus"
authors = [
    { name = "xizzxy", email = "xizzyxx@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-classic>=1.0.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-ollama>=0.3.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
